name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar la pagina web
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp icon.png www/icon.png
          if curl -fsSL https://cdn.tailwindcss.com/3.4.17 -o www/tailwind.js; then
            sed -i 's|https://cdn.tailwindcss.com/3.4.17|tailwind.js|' www/index.html
          fi

      - name: Insertar claves de ScreenScraper desde los secretos (si existen)
        env:
          SS_DEVID: ${{ secrets.SS_DEVID }}
          SS_DEVPASS: ${{ secrets.SS_DEVPASS }}
        run: |
          python3 - <<'PY'
          import os
          esc = lambda v: v.replace('\\', '\\\\').replace("'", "\\'").replace('\n', '').replace('\r', '')
          i, p = os.environ.get('SS_DEVID', '').strip(), os.environ.get('SS_DEVPASS', '').strip()
          if i and p:
              f = 'www/index.html'
              s = open(f, encoding='utf-8').read()
              s = s.replace('__SS_DEVID__', esc(i)).replace('__SS_DEVPASS__', esc(p))
              open(f, 'w', encoding='utf-8').write(s)
              print('Claves de ScreenScraper insertadas')
          else:
              print('Sin claves de ScreenScraper: se pediran dentro de la app')
          PY

      - name: Instalar Capacitor y crear proyecto Android
        run: |
          npm install
          npx cap add android

      - name: Agregar codigo nativo y permisos
        run: |
          PKG=android/app/src/main/java/com/gamelauncher/app
          mkdir -p $PKG
          cp LauncherPlugin.java MainActivity.java $PKG/
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n    <application|' $M
          sed -i 's|<activity|<activity android:screenOrientation="sensorLandscape"|' $M

      - name: Poner el icono de la app
        run: |
          python3 -m pip install pillow
          python3 - <<'PY'
          from PIL import Image
          import shutil
          res = 'android/app/src/main/res'
          shutil.rmtree(res + '/mipmap-anydpi-v26', ignore_errors=True)
          src = Image.open('icon.png').convert('RGBA')
          for d, n in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              im = src.resize((n, n), Image.LANCZOS)
              for f in ('ic_launcher.png', 'ic_launcher_round.png', 'ic_launcher_foreground.png'):
                  im.save(f'{res}/mipmap-{d}/{f}')
          PY

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Game Launcher (build ${{ github.run_number }})
          files: android/app/build/outputs/apk/debug/app-debug.apk
