<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Launcher</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #000; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }
  .bg-layer { transition: opacity 1s ease, transform 6s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .fade { animation: fade .5s ease-out; }
  body { background:#0d1218; font-family: "SST","Segoe UI",system-ui,-apple-system,Roboto,sans-serif; font-weight:300; }
  .gbtn { width:44px; height:44px; border-radius:9999px; display:inline-flex; align-items:center; justify-content:center; background:rgba(255,255,255,.14); backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,.12); font-size:16px; transition:transform .2s, background .2s; }
  .gbtn:hover { background:rgba(255,255,255,.28); transform:scale(1.08); }
  #modal > div { background:rgba(18,26,48,.78) !important; backdrop-filter:blur(30px); border:1px solid rgba(255,255,255,.14) !important; border-radius:28px !important; }
  .ttl { font-size:clamp(1.4rem,min(7.5vh,7vw),3.75rem); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; word-break:break-word; }
  .desc { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .gbtn { width:clamp(34px,9vh,46px); height:clamp(34px,9vh,46px); font-size:clamp(13px,3.6vh,17px); flex-shrink:0; }
  .playbtn { padding:clamp(.45rem,1.8vh,.8rem) clamp(1.6rem,6vh,2.6rem); font-size:clamp(.85rem,2.6vh,1rem); white-space:nowrap; }
  @media (max-height:520px) { .ttl, .desc { -webkit-line-clamp:1; } #rom { display:none; } }
  .i-teal { background:radial-gradient(circle at 30% 50%,rgba(14,70,100,.95),rgba(4,12,24,.9) 55%,transparent 75%); animation:iteal 3s ease forwards; }
  @keyframes iteal { 0%{opacity:0} 25%{opacity:1} 100%{opacity:0} }
  .i-spot { top:-5%; left:0; width:75%; height:110%; background:linear-gradient(110deg,rgba(255,236,205,.30),rgba(255,236,205,.07) 45%,transparent 75%); clip-path:polygon(8% 0,50% 0,88% 100%,0 100%); filter:blur(26px); opacity:0; animation:ispot 2.5s 1.2s ease forwards; }
  @keyframes ispot { to{opacity:1} }
  .i-fade { opacity:0; animation:ifade 1.2s 2.4s ease forwards; }
  @keyframes ifade { to{opacity:1} }
  .i-ring { position:relative; width:clamp(3.2rem,12vh,4.8rem); height:clamp(3.2rem,12vh,4.8rem); border-radius:9999px; border:2px solid rgba(255,255,255,.65); display:flex; align-items:center; justify-content:center; font-size:.6rem; font-weight:600; letter-spacing:.12em; opacity:0; animation:ifade 1.2s 2.8s ease forwards; }
  .i-ring::after { content:""; position:absolute; inset:-2px; border-radius:9999px; border:2px solid rgba(255,255,255,.5); animation:iring 2s 3s ease-out infinite; }
  @keyframes iring { 0%{transform:scale(1);opacity:.7} 100%{transform:scale(1.7);opacity:0} }
  .i-avatar { width:clamp(4.5rem,18vh,7rem); height:clamp(4.5rem,18vh,7rem); margin-top:3vh; border-radius:9999px; background:radial-gradient(circle at 35% 30%,#7fb2ff,#2a46c8 60%,#0e1a55); box-shadow:0 0 0 3px rgba(255,255,255,.85),0 0 40px rgba(110,160,255,.55); }
  @keyframes rise { from{opacity:0;transform:translateY(26px)} to{opacity:1;transform:none} }
  #app.enter header { animation:rise .8s both; }
  #app.enter #row { animation:rise .8s .15s both; }
  #app.enter #hero { animation:rise .8s .3s both; }
  #app.enter footer { animation:rise .8s .45s both; }
  .qrow { display:flex; align-items:center; gap:.7rem; width:100%; padding:.7rem .9rem; border-radius:1.2rem; font-size:.85rem; text-align:left; transition:background .15s; }
  .qrow:hover { background:rgba(255,255,255,.12); }
  #qmenu, #opts { background:rgba(18,26,48,.88); backdrop-filter:blur(30px); border:1px solid rgba(255,255,255,.14); box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .avbtn { width:clamp(34px,9vh,46px); height:clamp(34px,9vh,46px); border-radius:9999px; background:linear-gradient(135deg,#5b8cff,#6a4cff) center/cover; box-shadow:0 0 0 2px rgba(255,255,255,.55); font-weight:500; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  #qmenu { max-height:75vh; overflow-y:auto; }
  .wz-ico { height:min(32vh,14rem); width:auto; border-radius:22%; box-shadow:0 20px 60px rgba(0,0,0,.5); flex-shrink:0; }
  #wiz h1 { font-size:clamp(1.4rem,5.5vh,2.4rem); font-weight:300; line-height:1.15; }
  #wiz p { color:rgba(255,255,255,.65); font-size:clamp(.8rem,2.6vh,1rem); line-height:1.4; }
  .tt { display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden; word-break:break-word; }
  @keyframes swap { from{opacity:0;transform:translateX(18px)} to{opacity:1;transform:none} }
  @keyframes bgsw { from{opacity:.35} to{opacity:1} }
  .swap { animation:swap .35s ease-out; }
  .bgsw { animation:bgsw .5s ease-out; }
  :root { --S:min(27vh,19vw); --A:8vw; }
  .cat { font-size:clamp(.6rem,2.3vh,.85rem); font-weight:700; letter-spacing:.07em; text-transform:uppercase; padding:.3em .9em; border-radius:9999px; border:2px solid transparent; color:rgba(255,255,255,.92); white-space:nowrap; transition:border-color .2s; }
  .cat.on { border-color:#2f6bff; }
  .kbadge { font-size:.55rem; letter-spacing:.05em; padding:.1rem .45rem; border:1px solid rgba(255,255,255,.35); border-radius:.5rem; color:rgba(255,255,255,.6); }
  .plat { font-size:clamp(.5rem,1.9vh,.7rem); letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.45); padding-bottom:2px; border-bottom:2px solid transparent; white-space:nowrap; }
  .plat.on { color:#fff; border-color:#fff; }
  .ico { width:clamp(24px,6vh,32px); height:clamp(24px,6vh,32px); color:rgba(255,255,255,.92); display:flex; align-items:center; justify-content:center; }
  #row { display:flex; align-items:flex-end; gap:calc(var(--S)*.15); overflow-x:auto; scroll-snap-type:x mandatory; padding-left:calc(var(--A) + var(--S)*.085); padding-right:calc(100% - var(--A) - var(--S)); scroll-padding-left:var(--A); padding-top:1vh; position:relative; }
  .tile { flex:0 0 auto; position:relative; width:var(--S); height:var(--S); margin-inline:calc(var(--S)*-.085); border-radius:4px; overflow:hidden; cursor:pointer; transform:scale(.83); transform-origin:center bottom; filter:brightness(.82); scroll-snap-align:start; transition:transform .38s cubic-bezier(.34,1.35,.64,1), filter .25s, box-shadow .3s; }
  .tile.sel { transform:scale(1); filter:none; z-index:2; box-shadow:0 8px 30px rgba(0,0,0,.55); }
  .tcap { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:10%; text-align:center; font-size:clamp(.6rem,2.1vh,.8rem); font-weight:600; line-height:1.15; }
  .disc { position:absolute; right:7%; bottom:7%; width:12%; height:12%; min-width:12px; min-height:12px; border-radius:50%; background:rgba(0,0,0,.55); }
  .disc::after { content:""; position:absolute; inset:28%; border-radius:50%; background:#fff; }
  .lblp { font-size:clamp(.6rem,2.1vh,.8rem); letter-spacing:.15em; color:rgba(255,255,255,.55); margin-right:.8em; font-weight:600; }
  .lblt { font-size:clamp(.6rem,2.1vh,.8rem); color:rgba(255,255,255,.75); }
  .hint { font-size:clamp(.5rem,1.9vh,.7rem); letter-spacing:.1em; font-weight:700; color:rgba(255,255,255,.88); display:inline-flex; align-items:center; gap:.5em; }
  .pillic { width:.55em; height:1.1em; border-radius:.3em; border:1.5px solid #fff; display:inline-block; }
  #qmenu, #opts { display:none !important; }
  #pmenu { z-index:80; }
  #intro { z-index:60; } #wiz { z-index:70; } #modal { z-index:90; } #toast { z-index:95; }
  .pside { display:flex; flex-direction:column; gap:1.4vh; padding:1.4vh; border-radius:3vh; background:linear-gradient(180deg,rgba(120,122,126,.7),rgba(70,72,76,.78)); border:1px solid rgba(255,255,255,.2); backdrop-filter:blur(24px); flex-shrink:0; }
  .pbtn { width:clamp(2.6rem,13vh,4.4rem); height:clamp(2.6rem,13vh,4.4rem); border-radius:50%; background:rgba(26,28,32,.92); color:#fff; font-size:clamp(1.2rem,6vh,2rem); display:flex; align-items:center; justify-content:center; }
  .ppanel { width:min(78vw,62rem); max-height:88vh; display:flex; flex-direction:column; padding:2vh; border-radius:3.4vh; background:linear-gradient(180deg,rgba(116,118,122,.8),rgba(64,66,70,.86)); border:1px solid rgba(255,255,255,.2); backdrop-filter:blur(30px); box-shadow:0 30px 80px rgba(0,0,0,.5); }
  .ptitle { font-size:clamp(.6rem,2.1vh,.8rem); letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.65); padding:0 1.4vh 1vh; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #plist { overflow-y:auto; display:flex; flex-direction:column; gap:1vh; }
  .prow { display:flex; align-items:center; gap:1.6vh; padding:1.3vh 2vh; border-radius:3vh; background:rgba(24,26,30,.62); color:#f4f4f5; cursor:pointer; border:3px solid transparent; transition:border-color .15s, background .15s; flex-shrink:0; }
  .prow.on { border-color:#fff; background:rgba(30,32,36,.84); }
  .prow.dng .plb { color:#fca5a5; }
  .pic { width:4vh; text-align:center; font-size:clamp(1rem,3.6vh,1.5rem); flex-shrink:0; }
  .ptx { flex:1; min-width:0; display:flex; flex-direction:column; }
  .plb { font-size:clamp(.8rem,3.2vh,1.25rem); font-weight:700; }
  .psub { font-size:clamp(.6rem,2.1vh,.85rem); color:rgba(255,255,255,.62); font-weight:500; }
  .pch { font-size:clamp(1.1rem,4vh,1.6rem); color:#fff; flex-shrink:0; }
  #padfx { position:fixed; left:50%; top:3vh; transform:translateX(-50%); z-index:97; pointer-events:none; }
  .pfx { display:flex; align-items:center; gap:1.4vh; padding:1.2vh 2.4vh 1.2vh 1.2vh; border-radius:9999px; background:rgba(14,18,26,.84); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,.18); box-shadow:0 10px 40px rgba(0,0,0,.5); animation:pfxin 3.8s cubic-bezier(.34,1.4,.64,1) both; color:#fff; white-space:nowrap; }
  .pfx.off { animation-duration:2.4s; filter:grayscale(.75); }
  @keyframes pfxin { 0%{transform:translateY(-170%) scale(.85);opacity:0} 10%{transform:none;opacity:1} 86%{transform:none;opacity:1} 100%{transform:translateY(-70%) scale(.95);opacity:0} }
  .pfx-ic { position:relative; width:5.6vh; height:5.6vh; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--c); flex-shrink:0; }
  .pfx-ic::before { content:""; position:absolute; inset:0; border-radius:50%; border:2px solid var(--g); animation:pfxring 1.3s .35s ease-out 2; }
  @keyframes pfxring { 0%{transform:scale(1);opacity:.9} 100%{transform:scale(2.4);opacity:0} }
  .pfx-sp, .pfx-bd { display:none; position:absolute; border-radius:50%; }
  .pfx.xb .pfx-sp { display:block; inset:0; background:conic-gradient(from 0deg,#0b5a0b,#8be88b,#0b5a0b); animation:pfxspin 1s linear 3; }
  .pfx.xb .pfx-bd { display:block; inset:.5vh; background:#0f3d0f; }
  .pfx.xb .pfx-ic { background:none; }
  .pfx-ic svg { position:relative; z-index:1; }
  @keyframes pfxspin { to{transform:rotate(360deg)} }
  .pfx.nin .pfx-ic { animation:pfxbounce .5s .3s ease 3; }
  @keyframes pfxbounce { 50%{transform:translateY(-35%)} }
  .pfx-tx { display:flex; flex-direction:column; line-height:1.15; }
  .pfx-tx b { font-size:clamp(.8rem,3vh,1.1rem); }
  .pfx-tx span { font-size:clamp(.6rem,2.1vh,.8rem); color:rgba(255,255,255,.65); }
  .pfx-sym { display:flex; gap:.8vh; margin-left:1vh; }
  .pfx-sym i { font-style:normal; font-weight:800; font-size:clamp(.7rem,2.6vh,1rem); width:3.6vh; height:3.6vh; display:flex; align-items:center; justify-content:center; border-radius:50%; border:2px solid var(--k); color:var(--k); opacity:0; animation:pfxpop .4s cubic-bezier(.34,1.8,.64,1) var(--d) both; }
  @keyframes pfxpop { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }
  .pfx.ps { --c:linear-gradient(135deg,#2f6bff,#1a2f8f); --g:#5b8cff; box-shadow:0 10px 40px rgba(0,0,0,.5),0 0 40px rgba(70,120,255,.35); }
  .pfx.xb { --g:#5fd35f; box-shadow:0 10px 40px rgba(0,0,0,.5),0 0 40px rgba(60,200,60,.35); }
  .pfx.nin { --c:linear-gradient(90deg,#e60012 50%,#00a1e9 50%); --g:#ff4d5a; }
  .pfx.gen { --c:linear-gradient(135deg,#6b7280,#374151); --g:#cbd5e1; }
  #modal .mf, #wiz .mf { outline:3px solid #fff; outline-offset:2px; border-radius:.75rem; }
  #modal button.mf, #wiz button.mf { border-radius:9999px; }
  @keyframes iin { to { opacity:1; } }
  .i-scene { background:radial-gradient(ellipse at 50% 40%,#1b1f26 0%,#12151a 55%,#0a0c10 100%); opacity:0; animation:iin 1.6s 4.5s ease forwards; }
  .i-spotl { top:-8%; left:-2%; width:70%; height:120%; background:linear-gradient(112deg,rgba(255,238,215,.34),rgba(255,238,215,.1) 40%,transparent 72%); clip-path:polygon(4% 0,44% 0,86% 100%,0 100%); filter:blur(30px); opacity:0; animation:iin 1.8s 4.6s ease forwards; }
  .i-floor { height:28%; background:linear-gradient(to top,rgba(150,160,175,.26),transparent); opacity:0; animation:iin 1.8s 4.8s ease forwards; }
  .i-disc { position:absolute; left:50%; top:50%; width:min(96vw,150vh); aspect-ratio:1; border-radius:50%; background:radial-gradient(circle,rgba(8,44,66,.55) 0%,rgba(10,52,78,.6) 62%,rgba(18,78,112,.75) 86%,rgba(18,78,112,0) 100%); filter:blur(6px); opacity:0; transform:translate(-50%,-50%) scale(.88); animation:idisc 5.4s ease-in-out forwards; }
  @keyframes idisc { 0%{opacity:0;transform:translate(-50%,-50%) scale(.88)} 30%{opacity:.7} 70%{opacity:.9;transform:translate(-50%,-50%) scale(1.04)} 100%{opacity:0;transform:translate(-50%,-50%) scale(1.1)} }
  .i-bk { position:absolute; left:var(--x); top:var(--y); width:var(--s); height:var(--s); border-radius:50%; background:radial-gradient(circle,rgba(170,200,210,.14),rgba(170,200,210,.1) 70%,rgba(190,215,225,.24) 96%,transparent 100%); opacity:0; animation:ibk 2.2s var(--d) ease-in-out forwards; }
  @keyframes ibk { 0%{opacity:0;transform:scale(.8)} 35%{opacity:1} 100%{opacity:0;transform:scale(1.15)} }
  .i-health { position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); text-align:center; padding:0 8vw; font-size:clamp(.55rem,1.7vh,.8rem); color:rgba(255,255,255,.62); opacity:0; animation:ihl 4.2s .3s ease forwards; }
  @keyframes ihl { 0%{opacity:0} 20%{opacity:1} 75%{opacity:1} 100%{opacity:0} }
  .i-press { position:absolute; left:0; right:0; top:24%; text-align:center; font-size:clamp(.6rem,1.9vh,.85rem); color:rgba(255,255,255,.72); opacity:0; animation:iin .9s 6.4s ease forwards; }
  .i-btn { position:absolute; left:50%; top:50%; width:clamp(2.4rem,9vh,3.6rem); height:clamp(2.4rem,9vh,3.6rem); transform:translate(-50%,-50%); border-radius:50%; background:rgba(16,18,24,.78); box-shadow:0 0 0 1px rgba(255,255,255,.4); color:#fff; display:flex; align-items:center; justify-content:center; font-size:.52rem; font-weight:800; letter-spacing:.1em; opacity:0; animation:iin .9s 6.7s ease forwards; }
  .i-r1, .i-r2 { position:absolute; inset:-2px; border-radius:50%; border:2px solid rgba(255,255,255,.9); opacity:0; animation:irp 3s 7.8s ease-out infinite; }
  .i-r2 { border-width:1px; animation-delay:7.95s; }
  @keyframes irp { 0%{transform:scale(1);opacity:0} 10%{transform:scale(1.15);opacity:1} 55%{transform:scale(1.7);opacity:0} 100%{transform:scale(1.7);opacity:0} }
  .i-tap { position:absolute; left:0; right:0; bottom:9%; text-align:center; font-size:.7rem; color:rgba(255,255,255,.35); opacity:0; animation:iin 1s 8s ease forwards; }
</style>
</head>
<body>
<div id="app" class="relative w-full h-full overflow-hidden select-none">
  <div id="bg" class="absolute inset-0"></div>
  <video id="vid" class="absolute inset-0 w-full h-full object-cover opacity-0" style="object-position:70% center;transition:opacity 1s;filter:brightness(.55)" muted loop playsinline autoplay></video>
  <div class="absolute inset-0" style="background:linear-gradient(90deg,#0d1218 0%,rgba(13,18,24,.93) 26%,rgba(13,18,24,.45) 52%,rgba(13,18,24,0) 78%)"></div>
  <div class="absolute inset-0" style="background:linear-gradient(to top,rgba(8,11,15,.92) 0%,rgba(8,11,15,.55) 30%,transparent 52%),linear-gradient(to bottom,rgba(8,11,15,.6),transparent 22%)"></div>

  <div class="relative z-10 flex flex-col h-full" style="padding:0 max(2vw,env(safe-area-inset-right,0px)) 2vh max(2vw,env(safe-area-inset-left,0px))">
    <header class="flex items-center justify-between" style="height:9vh;min-height:30px">
      <div class="flex items-center gap-3 text-white/90" style="font-size:clamp(.7rem,2.6vh,.95rem)">
        <span id="clock" class="font-medium"></span>
        <span id="wifi" class="inline-flex"></span>
        <span class="inline-flex items-center gap-1"><span id="batic" class="inline-flex"></span><span id="batt"></span></span>
      </div>
      <div id="gpTop" class="flex items-center gap-1 text-white" style="opacity:.3;font-size:clamp(.6rem,2.2vh,.8rem)"><svg viewBox="0 0 24 24" width="1.5em" height="1.5em" fill="currentColor"><path d="M7 8h10a5 5 0 0 1 4.7 6.7l-.8 2.3a2.3 2.3 0 0 1-3.9.8L15.5 15h-7l-1.5 2.8a2.3 2.3 0 0 1-3.9-.8l-.8-2.3A5 5 0 0 1 7 8z"/></svg><b>1</b></div>
      <div class="flex items-center gap-3 relative">
        <button id="sstop" class="ico" title="Carátulas y datos (scrapear)"><svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg></button>
        <button id="srch" class="ico" title="Buscar"><svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></button>
        <button id="menubtn" class="ico" title="Menú"><svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <button id="avatar" class="avbtn" title="Perfil"></button>
        <div id="qmenu" class="hidden absolute right-0 top-full mt-3 z-30 w-64 rounded-3xl p-2">
          <button id="scanbtn" class="qrow"><span class="w-6 text-center">📁</span>Escanear ROMs</button>
          <button id="ssbtn" class="qrow"><span class="w-6 text-center">🗄️</span>Carátulas y datos</button>
          <button id="appsbtn" class="qrow"><span class="w-6 text-center">📱</span>Agregar juegos de Android</button>
          <button id="rescanbtn" class="qrow"><span class="w-6 text-center">🔄</span>Re-escanear mi carpeta</button>
          <button id="profbtn" class="qrow"><span class="w-6 text-center">👤</span>Perfil y foto</button>
          <button id="mute" class="qrow"><span class="w-6 text-center">🔇</span>Sonido: apagado</button>
          <button id="uibtn" class="qrow"></button>
          <button id="fs" class="qrow"><span class="w-6 text-center">⛶</span>Pantalla completa</button>
          <button id="setupbtn" class="qrow"><span class="w-6 text-center">⚙️</span>Repetir configuración</button>
          <div id="gpad" class="px-4 py-2 text-xs text-white/50">🎮 Conectar mando</div>
        </div>
      </div>
    </header>

    <nav class="flex items-center gap-2" style="padding-left:6vw">
      <button id="l1" class="kbadge">L1</button>
      <div id="cats" class="flex items-center gap-1 overflow-x-auto no-scrollbar"></div>
      <button id="r1" class="kbadge">R1</button>
    </nav>
    <div id="plats" class="flex items-center gap-4 overflow-x-auto no-scrollbar" style="padding-left:6vw;margin-top:1.4vh"></div>

    <div id="hero" class="flex-1 min-h-0 flex flex-col justify-center" style="padding-left:8vw"></div>

    <section>
      <div id="row" class="no-scrollbar scroll-smooth"></div>

<script>
const PLATFORMS = {
  ANDROID:{name:'Android App',code:'ANDROID',color:'bg-emerald-600'},
  PS2:{name:'PlayStation 2',code:'PS2',color:'bg-blue-700'},
  PSP:{name:'PlayStation Portable',code:'PSP',color:'bg-indigo-600'},
  SWITCH:{name:'Nintendo Switch',code:'SWITCH',color:'bg-red-600'},
  GAMECUBE:{name:'GameCube / Wii',code:'GAMECUBE',color:'bg-purple-700'},
  N3DS:{name:'Nintendo 3DS',code:'3DS',color:'bg-rose-600'},
  WINDOWS:{name:'Windows PC',code:'WIN',color:'bg-cyan-600'},
  GBA:{name:'Game Boy Advance',code:'GBA',color:'bg-amber-600'},
  XBOX:{name:'Xbox Clásico',code:'XBOX',color:'bg-green-700'},
  PS1:{name:'PlayStation',code:'PS1',color:'bg-slate-600'}
};
const CATS = ['ALL','NATIVE APPS','EMULATORS','FAVORITES','RECENTLY PLAYED'];
const games = [];
const U = (id,w)=>`https://images.unsplash.com/photo-${id}?q=80&w=${w}&auto=format&fit=crop`;
const V = 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/';
try { const sv = JSON.parse(localStorage.getItem('gl_games') || 'null'); const keep = Array.isArray(sv) ? sv.filter(x => typeof x.id === 'string') : []; keep.forEach(x => games.push(x)); if (Array.isArray(sv) && keep.length !== sv.length) save(); } catch(e) {}
function save(){ try { localStorage.setItem('gl_games', JSON.stringify(games)); } catch(e) {} }
let cat = 'ALL', plat = 'ALL', idx = 0, q = '', autoScroll = false, autoT = 0, lastTick = 0, mfCur = null, lastSt = null, lastPadKey = '', lastPad = null, padT = 0;
const $ = id => document.getElementById(id);
const list = () => games.filter(g =>
  !(cat==='NATIVE APPS' && g.type!=='NATIVE') && !(cat==='EMULATORS' && g.type!=='EMULATOR') &&
  !(cat==='FAVORITES' && !g.fav) && !(cat==='RECENTLY PLAYED' && !g.played) && !(plat!=='ALL' && g.platform!==plat) && (!q || (g.title+' '+g.platform).toLowerCase().includes(q)));
const clean = t => String(t).replace(/(\.(xiso|iso|cso|chd|bin|rvz|gcm|nsp|xci|3ds|cia|gba|pbp|cue|wbfs|gcz))+$/i, '');
const grad = g => `linear-gradient(135deg, ${g[0]}, ${g[1]})`;

function toast(m){ const t=$('toast'); t.textContent=m; t.classList.remove('hidden'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.add('hidden'),2500); }
function shiftCat(d){ sfx('cat'); cat = CATS[(CATS.indexOf(cat)+d+CATS.length)%CATS.length]; idx=0; render(); }

const CAT_LABEL = {'ALL':'Todos','NATIVE APPS':'Apps','EMULATORS':'Emuladores','FAVORITES':'Favoritos','RECENTLY PLAYED':'Recientes'};
function cycleBg(g){
  const av = ['shot','cover','video'].filter(m => m === 'shot' ? g.wall : m === 'cover' ? g.img : g.vid);
  if (av.length < 2) { toast('Este juego solo tiene un fondo. Usa “Carátulas y datos” para descargar más.'); return; }
  const i = av.indexOf(bgMode(g)); g.bgMode = av[(i + 1) % av.length]; save(); render(true, false); toast('🎞️ Fondo: ' + MODE_LABEL[g.bgMode]);
}
function render(soft, scrollTo){
  const gs = list(); if (idx >= gs.length) idx = 0;
  const cur = gs[idx];
  if (!soft) {
    $('cats').innerHTML = CATS.map(c => `<button data-c="${c}" class="cat ${c===cat?'on':''}">${CAT_LABEL[c]}</button>`).join('');
    $('plats').innerHTML = [['ALL','Todos']].concat(Object.entries(PLATFORMS).filter(([k]) => games.some(g => g.platform === k)).map(([k,p]) => [k, p.code])).map(([k,t]) => `<button data-p="${k}" class="plat ${plat===k?'on':''}">${t}</button>`).join('');
  }
  const mode = cur ? bgMode(cur) : 'shot';
  const art = !cur ? '' : (mode === 'cover' && cur.img ? cur.img : (cur.wall || ''));
  $('bg').style.background = cur ? `${art?`url('${art}') 72% center/cover, `:''}${grad(cur.g)}` : '#0d1218';
  $('bg').style.filter = (cur && mode === 'cover' && cur.img) ? 'brightness(.8) blur(3px)' : 'brightness(.85) saturate(1.1)';
  const vsrc = (cur && mode === 'video' && cur.vid) ? cur.vid : '';
  const v = $('vid');
  if (vsrc && v.dataset.s !== vsrc) { v.dataset.s = vsrc; v.src = vsrc; v.play().catch(()=>{}); v.style.opacity = 1; v.onerror = () => v.style.opacity = 0; } else if (!vsrc) { v.style.opacity = 0; v.dataset.s = ''; try { v.pause(); } catch(e) {} }
  if (!cur){
    $('row').innerHTML = ''; $('lbl').innerHTML = '';
    $('hero').innerHTML = games.length
      ? '<p class="text-white/60 text-lg">No hay juegos en esta categoría.</p>'
      : '<p class="text-3xl md:text-4xl font-light mb-2">Tu biblioteca está vacía</p><p class="text-white/60 text-sm mb-5 max-w-md">Elige la carpeta donde guardas tus juegos y el launcher los agrega solo.</p><div><button id="emptyscan" class="playbtn rounded-full bg-white text-black font-semibold">📁 Escanear ROMs</button></div>';
    const eb = $('emptyscan'); if (eb) eb.onclick = openScan;
    return;
  }
  $('hero').innerHTML = '';
  const p = PLATFORMS[cur.platform] || PLATFORMS.ANDROID;
  $('lbl').innerHTML = `<span class="lblp">${p.code}</span><span class="lblt">${clean(cur.title)}</span>`;
  const ic = t => `<span class="w-6 text-center">${t}</span>`;
  $('opts').innerHTML = `<p class="px-4 pt-2 pb-1 text-[11px] text-white/50 truncate">${clean(cur.title)}</p>
    <button id="play" class="qrow">${ic('▶')}Jugar</button>
    <button id="fav" class="qrow">${ic(cur.fav?'★':'☆')}${cur.fav?'Quitar de favoritos':'Agregar a favoritos'}</button>
    <button id="ai" class="qrow">${ic('✨')}Optimizador IA</button>
    <button id="scrape" class="qrow">${ic('🔄')}Carátulas y datos</button>
    <button id="bgm" class="qrow">${ic('🎞️')}Fondo: ${MODE_LABEL[mode]}</button>
    <button id="del" class="qrow !text-red-300">${ic('🗑️')}Quitar de la biblioteca</button>`;
  const rowHtml = () => gs.map((g,i) => `<div data-i="${i}" class="tile ${i===idx?'sel':''}" style="background:${g.img?`url('${g.img}') center/cover, `:''}${grad(g.g)}">${g.img?'':`<div class="tcap"><span class="tt">${clean(g.title)}</span></div>`}${g.type==='NATIVE'?'':'<span class="disc"></span>'}</div>`).join('');
  const row = $('row');
  if (!soft || row.children.length !== gs.length) { row.innerHTML = rowHtml(); soft = false; }
  else [...row.children].forEach((t, i) => t.classList.toggle('sel', i === idx));
  if (soft) { for (const [el, cls] of [[$('lbl'), 'swap'], [$('bg'), 'bgsw']]) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); } }
  const tgt = row.children[idx];
  if (tgt) {
    const left = tgt.offsetLeft - innerWidth * .08;
    if (!soft) row.scrollTo({ left, behavior:'instant' });
    else if (scrollTo !== false) { autoScroll = true; row.scrollTo({ left, behavior:'smooth' }); clearTimeout(autoT); autoT = setTimeout(() => autoScroll = false, 500); }
  }
  $('play').onclick = () => openModal(cur,'launch');
  $('ai').onclick = () => openModal(cur,'ai');
  $('scrape').onclick = openSS;
  $('bgm').onclick = () => cycleBg(cur);
  $('fav').onclick = () => { cur.fav = !cur.fav; save(); render(); };
  $('del').onclick = () => { if (confirm('¿Quitar "' + cur.title + '" de la biblioteca?')) { games.splice(games.indexOf(cur), 1); idx = 0; save(); render(); } };
}

function openModal(g, kind){ sfx('ok');
  const m = $('modal'); m.classList.remove('hidden'); m.classList.add('flex'); m.style.alignItems = '';
  const body = kind==='launch' ? `
    <h3 class="text-lg font-bold mb-3">${g.title}</h3>
    <div class="space-y-2 bg-black/60 p-4 rounded-xl border border-white/10 text-xs font-mono text-gray-300">
      <div class="flex justify-between border-b border-white/10 pb-2"><span class="text-gray-400">Tipo:</span><span class="text-emerald-400 font-bold">${g.type}</span></div>
      <div class="flex justify-between border-b border-white/10 pb-2 gap-3"><span class="text-gray-400">Package:</span><span class="text-blue-300 truncate">${g.pkg}</span></div>
      <div><span class="text-gray-400">ROM:</span><div class="text-yellow-300 text-[11px] break-all bg-white/5 p-1.5 rounded mt-1">${g.rom}</div></div>
    </div>
    <div class="mt-5 flex justify-end gap-3">
      <button onclick="closeModal()" class="px-5 py-2.5 bg-white/10 rounded-xl text-xs font-semibold">Cancelar</button>
      <button onclick="closeModal();launchGame('${g.id}')" class="px-6 py-2.5 bg-blue-600 rounded-xl text-xs font-bold shadow-lg shadow-blue-600/40">▶ Ejecutar Juego</button>

function wifiSvg(l, off){ const o = i => l >= i ? 1 : .25; return `<svg viewBox="0 0 24 24" width="1.25em" height="1.25em" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="opacity:${off?.5:1}"><path d="M2 9a14 14 0 0 1 20 0" opacity="${o(3)}"/><path d="M5 12.5a9.5 9.5 0 0 1 14 0" opacity="${o(2)}"/><path d="M8.5 16a5 5 0 0 1 7 0" opacity="${o(1)}"/><circle cx="12" cy="19.5" r="1.2" fill="currentColor" stroke="none"/>${off?'<path d="M3 3l18 18" stroke-width="2.4"/>':''}</svg>`; }

function battSvg(p, ch){ const c = ch ? '#4ade80' : (p <= 15 ? '#f87171' : '#fff'); return `<svg viewBox="0 0 28 14" width="1.9em" height="1em"><rect x="1" y="1" width="23" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".9"/><rect x="25" y="4.5" width="2" height="5" rx="1" fill="currentColor" opacity=".9"/><rect x="3" y="3" width="${Math.max(1, 19 * p / 100)}" height="8" rx="1.5" fill="${c}"/></svg>`; }
async function updStatus(){

// ===== Paquetes de sonido =====
function noise(dur, vol){
  const A = ac(); if (!A) return; const n = Math.floor(A.sampleRate * dur), buf = A.createBuffer(1, n, A.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = A.createBufferSource(), g = A.createGain(), f = A.createBiquadFilter();
  f.type = 'highpass'; f.frequency.value = 2500 * pv; g.gain.value = vol; src.buffer = buf; src.connect(f); f.connect(g); g.connect(A.destination); src.start();
}
const BUFS = {};
async function loadBuf(k){
  const A = ac(); if (!A || BUFS[k] || !AUD[k]) return;
  try { const bin = atob(AUD[k].split(',')[1]), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); BUFS[k] = await A.decodeAudioData(u.buffer); } catch(e) {}
}
function playBuf(k, vol, rate){
  const A = ac(); if (!A) return; const b = BUFS[k]; if (!b) { loadBuf(k); return; }
  const s = A.createBufferSource(), g = A.createGain(); s.buffer = b; s.playbackRate.value = rate || 1; g.gain.value = vol == null ? 1 : vol; s.connect(g); g.connect(A.destination); s.start();
}

    ok(){ tone(800,0,.14,.07,300); tone(1200,.1,.2,.05,500); }, back(){ tone(500,0,.14,.05,250); } },
  arcade: { name:'Arcade', desc:'Barridos electrónicos',

// ===== Menú tipo iiSU: panel grande con filas =====
let pstack = [];

function openPanel(title, build, opt){ pstack.push({ title, build, opt: opt || {}, f: 0, items: [] }); const m = $('pmenu'); m.classList.remove('hidden'); m.classList.add('flex'); pmRender(); }
function pmRender(){

  $('plist').innerHTML = t.items.map((it, i) => `<div class="prow ${i === t.f ? 'on' : ''} ${it.danger ? 'dng' : ''}" data-pi="${i}"><span class="pic">${it.i}</span><span class="ptx"><span class="plb">${it.t}</span>${it.s ? `<span class="psub">${it.s}</span>` : ''}</span>${it.go ? '<span class="pch">›</span>' : ''}</div>`).join('');

}
function pmMove(d){ const t = pmTop(); if (!t || !t.items.length) return; t.f = (t.f + d + t.items.length) % t.items.length; sfx('move'); pmRender(); }
function pmGo(i){

    f: () => { pack = k; try { localStorage.setItem('gl_pack', k); } catch(e) {} if (k !== 'none' && !uiSound) { uiSound = true; try { localStorage.setItem('gl_ui', '1'); } catch(e) {} paintUi(); } sfx('move'); setTimeout(() => sfx('ok'), 260); } })));
}

}

// ===== Animaciones al conectar mandos =====
const CTRL_SVG = '<svg viewBox="0 0 24 24" width="62%" height="62%" fill="#fff"><path d="M7 8h10a5 5 0 0 1 4.7 6.7l-.8 2.3a2.3 2.3 0 0 1-3.9.8L15.5 15h-7l-1.5 2.8a2.3 2.3 0 0 1-3.9-.8l-.8-2.3A5 5 0 0 1 7 8z"/></svg>';
function padBrand(id){
  const t = (id || '').toLowerCase(), v = (t.match(/vendor:\s*([0-9a-f]{4})/) || t.match(/^([0-9a-f]{4})-/) || [])[1] || '';
  if (v === '054c' || /playstation|dualsense|dualshock|sony/.test(t)) return 'ps';
  if (v === '045e' || /xbox|x-box|xinput/.test(t)) return 'xb';
  if (v === '057e' || /nintendo|switch|joy-con/.test(t)) return 'nin';
  return 'gen';
}
function padInfo(gp){
  const id = gp.id || '', brand = padBrand(id), pid = ((id.toLowerCase().match(/product:\s*([0-9a-f]{4})/) || [])[1]) || '';
  const name = brand === 'ps' ? ({ '0ce6':'DualSense', '0df2':'DualSense Edge', '09cc':'DualShock 4', '05c4':'DualShock 4' }[pid] || 'Mando PlayStation')
    : brand === 'xb' ? 'Mando Xbox' : brand === 'nin' ? 'Mando Nintendo' : (id.split('(')[0].trim() || 'Mando');
  return { brand, name };
}
function padSound(brand, off){
  if (!uiSound || pack === 'none') return; pv = 1;
  try {
    if (off) { tone(660, 0, .18, .06, 330); tone(440, .12, .25, .05, 220); return; }
    if (brand === 'ps') { tone(587, 0, .25, .07); tone(880, .12, .3, .06); tone(1174, .24, .5, .05); [.55, .7, .85, 1].forEach((t, i) => tone(1500 + i * 180, t, .08, .025)); }
    else if (brand === 'xb') { tone(150, 0, .5, .035, 600, 'sawtooth'); tone(392, .3, .5, .06); tone(587, .42, .5, .055); tone(784, .54, .8, .05); }
    else if (brand === 'nin') { tone(988, 0, .08, .05, null, 'square'); tone(1319, .09, .22, .05, null, 'square'); }
    else { tone(660, 0, .12, .06); tone(990, .08, .25, .05); }
  } catch(e) {}
}
function padFx(brand, name, n, off){
  const sets = { ps:[['△','#54d6a1'],['○','#ff6b7a'],['✕','#6aa8ff'],['□','#ff9bd2']], xb:[['A','#7ddc6b'],['B','#ff5a5a'],['X','#5aa8ff'],['Y','#ffd23f']], nin:[['A','#fff'],['B','#fff'],['X','#fff'],['Y','#fff']], gen:[] };
  const box = $('padfx'); clearTimeout(padT);
  box.innerHTML = `<div class="pfx ${brand} ${off ? 'off' : ''}"><div class="pfx-ic"><span class="pfx-sp"></span><span class="pfx-bd"></span>${CTRL_SVG}</div><div class="pfx-tx"><b>${name}</b><span>${off ? 'Mando desconectado' : 'Mando ' + n + ' conectado'}</span></div>${off ? '' : `<div class="pfx-sym">${sets[brand].map(([t, c], i) => `<i style="--k:${c};--d:${(.55 + i * .15).toFixed(2)}s">${t}</i>`).join('')}</div>`}</div>`;
  padT = setTimeout(() => { box.innerHTML = ''; }, off ? 2500 : 3900);
  padSound(brand, off);
}
function onPadConnect(gp){
  const info = padInfo(gp); lastPad = info; padFx(info.brand, info.name, gp.index + 1, false);
  try { gp.vibrationActuator && gp.vibrationActuator.playEffect('dual-rumble', { startDelay:0, duration:220, weakMagnitude:.6, strongMagnitude:.4 }); } catch(e) {}
}
function onPadDisconnect(){ const i = lastPad || { brand:'gen', name:'Mando' }; padFx(i.brand, i.name, 1, true); }
function openPadTest(){
  const go = (b, n) => () => setTimeout(() => padFx(b, n, 1, false), 200);
  openPanel('Animaciones de mando', () => [
    { i:'🔵', t:'PlayStation', s:'DualSense / DualShock', f:go('ps', 'DualSense') },
    { i:'🟢', t:'Xbox', s:'Xbox Wireless Controller', f:go('xb', 'Mando Xbox') },
    { i:'🔴', t:'Nintendo', s:'Switch Pro / Joy-Con', f:go('nin', 'Mando Nintendo') },
    { i:'⚪', t:'Otro mando', s:'8BitDo, GameSir y similares', f:go('gen', 'Mando') },
    { i:'⏏️', t:'Desconexión', s:'Animación al quitar el mando', f:() => setTimeout(() => padFx('ps', 'DualSense', 1, true), 200) }
  ]);
}


// ===== Navegación con mando en ventanas y asistente =====
const modalOpen = () => !$('modal').classList.contains('hidden');
function mfRoot(){ return modalOpen() ? $('modal') : (wizOn ? $('wiz') : null); }
function mfEls(){
  const r = mfRoot(); if (!r) return [];
  return [...r.querySelectorAll('button:not([disabled]), input:not([disabled]), select')].filter(e => e.type !== 'file' && e.getBoundingClientRect().width > 0 && e.offsetParent !== null);
}
function mfMark(el){
  document.querySelectorAll('.mf').forEach(n => n.classList.remove('mf')); mfCur = el;
  if (el) { (el.type === 'checkbox' ? (el.closest('label') || el) : el).classList.add('mf'); el.scrollIntoView({ block:'nearest', inline:'nearest' }); }
}
function mfMove(dx, dy){
  const els = mfEls(); if (!els.length) return;
  if (!mfCur || !els.includes(mfCur)) { mfMark(els[0]); sfx('move'); return; }
  const c = mfCur.getBoundingClientRect(), cx = c.left + c.width / 2, cy = c.top + c.height / 2; let best = null, bs = 1e9;
  for (const e of els) {
    if (e === mfCur) continue; const r = e.getBoundingClientRect(), ddx = r.left + r.width / 2 - cx, ddy = r.top + r.height / 2 - cy;
    if ((dx > 0 && ddx < 4) || (dx < 0 && ddx > -4) || (dy > 0 && ddy < 4) || (dy < 0 && ddy > -4)) continue;
    const ov = dx ? !(r.bottom < c.top || r.top > c.bottom) : !(r.right < c.left || r.left > c.right);
    const sc = (dx ? Math.abs(ddx) + Math.abs(ddy) * .3 : Math.abs(ddy) + Math.abs(ddx) * .3) + (ov ? 0 : 5000); if (sc < bs) { bs = sc; best = e; }
  }
  if (best) { mfMark(best); sfx('move'); }
}
function mfAct(){
  const els = mfEls(); if (!mfCur || !els.includes(mfCur)) { if (els.length) mfMark(els[0]); return; }
  sfx('ok'); const e = mfCur; if (e.tagName === 'INPUT' && e.type !== 'checkbox') e.focus(); else e.click();
}
function gpUiNav(gp){
  const b = i => gp.buttons[i] && gp.buttons[i].pressed, x = gp.axes[0] || 0, y = gp.axes[1] || 0;
  if (b(13) || y > .5) mfMove(0, 1); else if (b(12) || y < -.5) mfMove(0, -1); else if (b(15) || x > .5) mfMove(1, 0); else if (b(14) || x < -.5) mfMove(-1, 0);
  else if (b(0)) mfAct(); else if (b(1)) { if (modalOpen()) closeModal(); else return false; } else return false;
  return true;
}

loadBuf('scroll'); loadBuf('sel'); startIntroAudio();
render();
