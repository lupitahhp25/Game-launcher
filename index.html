<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Launcher</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #000; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }
  .bg-layer { transition: opacity 1s ease, transform 6s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .fade { animation: fade .5s ease-out; }
</style>
</head>
<body>
<div id="app" class="relative w-full h-full overflow-hidden select-none">
  <div id="bg" class="absolute inset-0"></div><video id="vid" class="absolute inset-0 w-full h-full object-cover opacity-0" style="transition:opacity 1s;filter:brightness(.4)" muted loop playsinline autoplay></video>
  <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-black/70"></div>
  <div class="absolute inset-0 bg-gradient-to-r from-black/90 via-black/40 to-transparent"></div>

  <div class="relative z-10 flex flex-col justify-between h-full p-5 md:p-8">
    <header class="flex flex-col lg:flex-row justify-between items-center gap-3">
      <div class="flex items-center gap-3">
        <span id="clock" class="text-xl font-mono font-bold"></span>
        <span class="text-xs text-emerald-400 bg-emerald-950/40 px-2.5 py-1 rounded-full border border-emerald-500/30">🔋 90%</span>
        <span id="gpad" class="text-xs text-gray-400 bg-black/40 px-2.5 py-1 rounded-full border border-white/10">🎮 Conectar mando</span>
      </div>
      <nav class="flex items-center gap-1 bg-black/60 backdrop-blur-xl px-3 py-1.5 rounded-full border border-white/10 max-w-full">
        <button id="l1" class="px-2 py-0.5 text-xs font-mono bg-white/10 rounded hover:bg-white/20">L1</button>
        <div id="cats" class="flex gap-1 overflow-x-auto no-scrollbar"></div>
        <button id="r1" class="px-2 py-0.5 text-xs font-mono bg-white/10 rounded hover:bg-white/20">R1</button>
      </nav>
      <div class="flex items-center gap-2">
        <button id="srch" class="p-2 bg-black/40 border border-white/10 rounded-full text-sm">🔍</button><button id="mute" class="p-2 bg-black/40 border border-white/10 rounded-full text-sm">🔇</button><button id="fs" class="p-2 bg-black/40 border border-white/10 rounded-full text-sm" title="Pantalla completa / horizontal">⛶</button>
        <button id="scanbtn" class="px-3 py-1.5 bg-indigo-600/80 text-xs font-semibold rounded-full">📁 Escanear ROMs</button>
        <span class="hidden md:inline px-3 py-1.5 bg-purple-600/80 text-xs font-semibold rounded-full">🗄️ ScreenScraper</span>
        <span class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center font-bold text-xs ring-2 ring-white/30">PS5</span>
      </div>
    </header>

    <main id="hero" class="my-auto max-w-2xl space-y-3.5 fade"></main>

    <footer class="space-y-3">
      <div id="plats" class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1"></div>
      <div id="row" class="flex gap-3.5 overflow-x-auto py-4 px-1 no-scrollbar scroll-smooth"></div>
      <div class="flex flex-wrap items-center gap-x-5 gap-y-1 text-[11px] text-gray-400 border-t border-white/10 pt-2.5">
        <span>✕ / Enter · Ejecutar</span><span>□ / S · Scrapear</span><span>◀ ▶ · Moverse</span><span>Q / E · Categorías</span>
      </div>
    </footer>
  </div>

  <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 hidden bg-blue-600/90 text-xs font-semibold px-4 py-2 rounded-full shadow-2xl border border-blue-400/50"></div>
  <div id="modal" class="fixed inset-0 z-50 hidden bg-black/85 backdrop-blur-xl items-center justify-center p-4"></div>
</div>

<script>
const PLATFORMS = {
  ANDROID:{name:'Android App',code:'ANDROID',color:'bg-emerald-600'},
  PS2:{name:'PlayStation 2',code:'PS2',color:'bg-blue-700'},
  PSP:{name:'PlayStation Portable',code:'PSP',color:'bg-indigo-600'},
  SWITCH:{name:'Nintendo Switch',code:'SWITCH',color:'bg-red-600'},
  GAMECUBE:{name:'GameCube / Wii',code:'GAMECUBE',color:'bg-purple-700'},
  N3DS:{name:'Nintendo 3DS',code:'3DS',color:'bg-rose-600'},
  WINDOWS:{name:'Windows PC',code:'WIN',color:'bg-cyan-600'},
  GBA:{name:'Game Boy Advance',code:'GBA',color:'bg-amber-600'}
};
const CATS = ['ALL','NATIVE APPS','EMULATORS','FAVORITES','RECENTLY PLAYED'];
const games = [
  {id:1,title:'The Last of Us Part II Remastered',type:'NATIVE',platform:'ANDROID',publisher:'Naughty Dog',year:'2024',fav:true,played:true,g:['#14532d','#052e16'],desc:'Cinco años después de su peligroso viaje, Ellie y Joel se han establecido en Jackson, Wyoming.',pkg:'com.sony.tlou2.android',rom:'N/A (App nativa)',emu:'Native Android Package'},
  {id:2,title:'God of War II',type:'EMULATOR',platform:'PS2',publisher:'Santa Monica Studio',year:'2007',fav:true,played:true,g:['#7f1d1d','#1e1b4b'],desc:'Kratos, el nuevo Dios de la Guerra, busca venganza contra Zeus y los olímpicos que lo traicionaron.',pkg:'xyz.aethersx2.android',rom:'/storage/emulated/0/RetroGames/PS2/God_of_War_II.iso',emu:'AetherSX2 / NetherSX2'},
  {id:3,title:'God of War: Chains of Olympus',type:'EMULATOR',platform:'PSP',publisher:'Ready at Dawn',year:'2008',fav:false,played:true,g:['#312e81','#0f172a'],desc:'Durante los 10 años de servicio de Kratos a los dioses, combate al ejército persa.',pkg:'org.ppsspp.ppsspp',rom:'/storage/emulated/0/Emulation/ROMs/PSP/GoW_CoO.cso',emu:'PPSSPP Gold'},
  {id:4,title:'The Legend of Zelda: Breath of the Wild',type:'EMULATOR',platform:'SWITCH',publisher:'Nintendo',year:'2017',fav:true,played:true,g:['#0e7490','#14532d'],desc:'Un mundo de descubrimiento, exploración y aventura que rompe todos los límites.',pkg:'org.yuzu.yuzu_emu',rom:'/storage/emulated/0/SwitchROMs/Zelda_BotW.nsp',emu:'Yuzu / Suyu / Eden'}
];
const U = (id,w)=>`https://images.unsplash.com/photo-${id}?q=80&w=${w}&auto=format&fit=crop`;
const V = 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/';
const MEDIA = {
  1:{img:U('1542751371-adc38448a05e',600),wall:U('1518709268805-4e9042af9f23',1600),vid:V+'TearsOfSteel.mp4'},
  2:{img:U('1579783902614-a3fb3927b675',600),wall:U('1509198397868-475647b2a1e5',1600),vid:V+'Sintel.mp4'},
  3:{img:U('1511512578047-dfb367046420',600),wall:U('1451187580459-43490279c0fa',1600),vid:V+'ElephantsDream.mp4'},
  4:{img:U('1534447677768-be436bb09401',600),wall:U('1518709268805-4e9042af9f23',1600),vid:V+'BigBuckBunny.mp4'}
};
games.forEach(g => Object.assign(g, MEDIA[g.id]));
try { const sv = JSON.parse(localStorage.getItem('gl_games') || 'null'); if (Array.isArray(sv) && sv.length) { games.length = 0; sv.forEach(x => games.push(x)); } } catch(e) {}
function save(){ try { localStorage.setItem('gl_games', JSON.stringify(games)); } catch(e) {} }
let cat = 'ALL', plat = 'ALL', idx = 0, q = '';
const $ = id => document.getElementById(id);
const list = () => games.filter(g =>
  !(cat==='NATIVE APPS' && g.type!=='NATIVE') && !(cat==='EMULATORS' && g.type!=='EMULATOR') &&
  !(cat==='FAVORITES' && !g.fav) && !(cat==='RECENTLY PLAYED' && !g.played) && !(plat!=='ALL' && g.platform!==plat) && (!q || (g.title+' '+g.platform).toLowerCase().includes(q)));
const grad = g => `linear-gradient(135deg, ${g[0]}, ${g[1]})`;

function toast(m){ const t=$('toast'); t.textContent=m; t.classList.remove('hidden'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.add('hidden'),2500); }
function shiftCat(d){ cat = CATS[(CATS.indexOf(cat)+d+CATS.length)%CATS.length]; idx=0; render(); }

function render(){
  const gs = list(); if (idx >= gs.length) idx = 0;
  const cur = gs[idx];
  $('cats').innerHTML = CATS.map(c => `<button data-c="${c}" class="px-4 py-1 rounded-full text-xs font-semibold tracking-wider whitespace-nowrap transition ${c===cat?'bg-blue-600 shadow-lg shadow-blue-500/50 scale-105':'text-gray-400 hover:text-white hover:bg-white/5'}">${c}</button>`).join('');
  $('plats').innerHTML = `<span class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mr-1">Sistema:</span>` +
    `<button data-p="ALL" class="px-3 py-0.5 rounded-md text-[11px] font-semibold whitespace-nowrap ${plat==='ALL'?'bg-white text-black':'bg-white/10 text-gray-400'}">Todos los Sistemas</button>` +
    Object.entries(PLATFORMS).map(([k,p]) => `<button data-p="${k}" class="px-2.5 py-0.5 rounded-md text-[10px] font-mono font-bold ${plat===k?p.color+' ring-2 ring-white':'bg-white/10 text-gray-400'}">${p.code}</button>`).join('');
  $('bg').style.background = cur ? `${cur.wall?`url('${cur.wall}') center/cover, `:''}${grad(cur.g)}` : '#000';
  $('bg').style.filter = 'brightness(.45) saturate(1.2)';
  const v = $('vid');
  if (cur && cur.vid && v.dataset.s !== cur.vid) { v.dataset.s = cur.vid; v.src = cur.vid; v.play().catch(()=>{}); v.style.opacity = 1; v.onerror = () => v.style.opacity = 0; } else if (!cur || !cur.vid) { v.style.opacity = 0; v.dataset.s = ''; }
  if (!cur){ $('hero').innerHTML = '<p class="text-gray-400">No hay juegos en esta categoría.</p>'; $('row').innerHTML=''; return; }
  const p = PLATFORMS[cur.platform];
  $('hero').innerHTML = `
    <div class="flex items-center flex-wrap gap-2">
      <span class="px-3 py-0.5 rounded-md text-[11px] font-mono font-bold ${p.color}">${p.name} (${p.code})</span>
      <span class="px-2.5 py-0.5 rounded text-[10px] font-bold uppercase border ${cur.type==='NATIVE'?'bg-emerald-950/60 border-emerald-500/40 text-emerald-300':'bg-purple-950/60 border-purple-500/40 text-purple-300'}">${cur.type==='NATIVE'?'Aplicación Nativa':'ROM • '+cur.emu}</span>
      <span class="text-xs text-gray-400">${cur.publisher} · ${cur.year}</span>
    </div>
    <h1 class="text-3xl md:text-5xl font-black tracking-tight leading-none drop-shadow-xl">${cur.title}</h1>
    <p class="text-xs md:text-sm text-gray-300 leading-relaxed max-w-xl">${cur.desc}</p>
    <div class="bg-black/50 border border-white/10 rounded-lg p-2 max-w-xl text-[11px] font-mono text-gray-300 truncate">💾 ${cur.type==='NATIVE'?'Package ID: '+cur.pkg:'Ruta ROM: '+cur.rom}</div>
    <div class="flex flex-wrap items-center gap-3 pt-2">
      <button id="play" class="px-7 py-3 bg-white text-black font-extrabold text-sm rounded-full shadow-xl hover:scale-105 active:scale-95 transition">▶ ${cur.type==='NATIVE'?'Abrir App':'Iniciar ROM'}</button>
      <button id="scrape" class="px-5 py-3 bg-purple-900/60 text-xs font-semibold rounded-full border border-purple-400/40 hover:scale-105 transition">🔄 Scrapear Juego</button>
      <button id="ai" class="px-5 py-3 bg-indigo-900/60 text-xs font-semibold rounded-full border border-indigo-400/40 hover:scale-105 transition">✨ Optimizador IA</button>
      <button id="fav" class="p-3 rounded-full border ${cur.fav?'bg-rose-600/30 border-rose-500 text-rose-400':'bg-black/40 border-white/10 text-gray-400'}">🏆</button>
      <button id="del" class="p-3 rounded-full border bg-black/40 border-white/10 text-gray-400" title="Quitar de la biblioteca">🗑️</button>
    </div>`;
  $('row').innerHTML = gs.map((g,i) => `
    <div data-i="${i}" class="relative flex-shrink-0 cursor-pointer rounded-xl transition-all duration-300 ${i===idx?'w-36 h-48 md:w-44 md:h-56 ring-4 ring-white shadow-2xl shadow-blue-500/50 -translate-y-3 z-20':'w-28 h-36 md:w-36 md:h-48 opacity-60 hover:opacity-100 hover:-translate-y-1'}" style="background:${g.img?`url('${g.img}') center/cover, `:''}${grad(g.g)}">
      <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/10 to-transparent rounded-xl flex flex-col justify-between p-2.5">
        <div class="flex justify-between"><span class="px-1.5 py-0.5 rounded text-[9px] font-mono font-bold ${PLATFORMS[g.platform].color}">${PLATFORMS[g.platform].code}</span>${g.fav?'<span class="text-yellow-400 text-xs">★</span>':''}</div>
        <div><p class="text-xs font-bold leading-tight">${g.title}</p><p class="text-[9px] font-mono text-gray-400 mt-0.5">${g.type}</p></div>
      </div>
    </div>`).join('');
  const sel = $('row').children[idx]; if (sel) sel.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  $('play').onclick = () => openModal(cur,'launch');
  $('ai').onclick = () => openModal(cur,'ai');
  $('scrape').onclick = () => toast('🔄 Scrapeando medios de ' + cur.title + '…');
  $('fav').onclick = () => { cur.fav = !cur.fav; save(); render(); };
  $('del').onclick = () => { if (confirm('¿Quitar "' + cur.title + '" de la biblioteca?')) { games.splice(games.indexOf(cur), 1); idx = 0; save(); render(); } };
}

function openModal(g, kind){
  const m = $('modal'); m.classList.remove('hidden'); m.classList.add('flex'); m.style.alignItems = '';
  const body = kind==='launch' ? `
    <h3 class="text-lg font-bold mb-3">${g.title}</h3>
    <div class="space-y-2 bg-black/60 p-4 rounded-xl border border-white/10 text-xs font-mono text-gray-300">
      <div class="flex justify-between border-b border-white/10 pb-2"><span class="text-gray-400">Tipo:</span><span class="text-emerald-400 font-bold">${g.type}</span></div>
      <div class="flex justify-between border-b border-white/10 pb-2 gap-3"><span class="text-gray-400">Package:</span><span class="text-blue-300 truncate">${g.pkg}</span></div>
      <div><span class="text-gray-400">ROM:</span><div class="text-yellow-300 text-[11px] break-all bg-white/5 p-1.5 rounded mt-1">${g.rom}</div></div>
    </div>
    <div class="mt-5 flex justify-end gap-3">
      <button onclick="closeModal()" class="px-5 py-2.5 bg-white/10 rounded-xl text-xs font-semibold">Cancelar</button>
      <button onclick="closeModal();launchGame('${g.id}')" class="px-6 py-2.5 bg-blue-600 rounded-xl text-xs font-bold shadow-lg shadow-blue-600/40">▶ Ejecutar Juego</button>
    </div>` : `
    <h3 class="text-lg font-bold mb-3">✨ Optimizador IA</h3>
    <div class="bg-blue-950/40 p-3.5 rounded-xl border border-blue-500/30 text-xs text-gray-200 leading-relaxed">Perfil sugerido para <b>${g.title}</b>: renderer Vulkan, resolución 2x nativa y driver de GPU actualizado. Batería estimada: ${g.type==='NATIVE'?'~4.5 h':'~2.8 h'}.</div>
    <div class="mt-5 flex justify-end"><button onclick="closeModal()" class="px-5 py-2 bg-white/10 rounded-lg text-xs">Entendido</button></div>`;
  m.innerHTML = `<div class="bg-gray-900 border border-white/20 rounded-2xl w-full max-w-lg p-6 shadow-2xl">${body}</div>`;
}
function closeModal(){ const m=$('modal'); m.classList.add('hidden'); m.classList.remove('flex'); }

document.addEventListener('click', e => {
  const c = e.target.closest('[data-c]'), p = e.target.closest('[data-p]'), i = e.target.closest('[data-i]');
  if (c){ cat=c.dataset.c; idx=0; render(); }
  else if (p){ plat=p.dataset.p; idx=0; render(); }
  else if (i){ idx=+i.dataset.i; render(); }
});
$('l1').onclick = () => shiftCat(-1);
$('r1').onclick = () => shiftCat(1);
$('modal').onclick = e => { if (e.target.id==='modal') closeModal(); };
document.addEventListener('keydown', e => {
  if (!$('modal').classList.contains('hidden')) { if (e.key==='Escape') closeModal(); return; }
  const n = list().length || 1;
  if (e.key==='ArrowRight'){ idx=(idx+1)%n; render(); }
  else if (e.key==='ArrowLeft'){ idx=(idx-1+n)%n; render(); }
  else if (e.key==='q'||e.key==='Q') shiftCat(-1);
  else if (e.key==='e'||e.key==='E') shiftCat(1);
  else if (e.key==='Enter'){ const g=list()[idx]; if (g) openModal(g,'launch'); }
  else if (e.key==='s'||e.key==='S'){ const g=list()[idx]; if (g) toast('🔄 Scrapeando ' + g.title + '…'); }
});
function tick(){ const d=new Date(); $('clock').textContent = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
tick(); setInterval(tick, 10000);

function openSearch(){
  const m = $('modal'); m.classList.remove('hidden'); m.classList.add('flex'); m.style.alignItems = 'flex-start';
  m.innerHTML = `<div class="bg-gray-900 border border-white/20 rounded-2xl w-full max-w-lg p-5 mt-16"><input id="qi" value="${q}" placeholder="Buscar juegos, sistemas…" class="w-full bg-white/10 rounded-xl px-3 py-2 text-sm outline-none border border-white/10"><p class="text-xs text-gray-400 mt-3">Los resultados se filtran en el carrusel.</p><div class="mt-4 flex justify-end gap-2"><button onclick="q='';idx=0;render();closeModal()" class="px-4 py-1.5 bg-white/10 rounded-lg text-xs">Limpiar</button><button onclick="closeModal()" class="px-4 py-1.5 bg-blue-600 rounded-lg text-xs">Listo</button></div></div>`;
  const i = $('qi'); i.oninput = () => { q = i.value.toLowerCase(); idx = 0; render(); }; i.focus();
}
async function goFS(){
  try {
    if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
    if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape');
    toast('Modo horizontal activado');
  } catch(e) { toast('Gira tu pantalla manualmente'); }
}
$('srch').onclick = openSearch;
$('scanbtn').onclick = openScan;
$('fs').onclick = goFS;
$('mute').onclick = () => { const v = $('vid'); v.muted = !v.muted; $('mute').textContent = v.muted ? '🔇' : '🔊'; };

// Gamepad (Bluetooth / USB)
let gpLast = 0;
function pad(){
  const gp = [...(navigator.getGamepads ? navigator.getGamepads() : [])].find(g => g && g.connected);
  $('gpad').textContent = gp ? '🎮 Mando listo' : '🎮 Conectar mando';
  if (gp && Date.now() - gpLast > 200) {
    const b = i => gp.buttons[i] && gp.buttons[i].pressed, x = gp.axes[0] || 0, n = list().length || 1;
    const open = !$('modal').classList.contains('hidden');
    let act = true;
    if (open) { if (b(1)) closeModal(); else act = false; }
    else if (b(15) || x > .4) { idx = (idx+1)%n; render(); }
    else if (b(14) || x < -.4) { idx = (idx-1+n)%n; render(); }
    else if (b(4)) shiftCat(-1);
    else if (b(5)) shiftCat(1);
    else if (b(0)) { const g = list()[idx]; if (g) openModal(g,'launch'); }
    else if (b(2)) { const g = list()[idx]; if (g) toast('🔄 Scrapeando ' + g.title + '…'); }
    else act = false;
    if (act) gpLast = Date.now();
  }
  requestAnimationFrame(pad);
}
requestAnimationFrame(pad);

// ===== Puente con Android (plugin nativo Launcher) =====
const Launcher = (() => {
  const C = window.Capacitor; if (!C) return null;
  if (C.Plugins && C.Plugins.Launcher) return C.Plugins.Launcher;
  if (C.registerPlugin) { try { return C.registerPlugin('Launcher'); } catch (e) {} }
  return null;
})();
const EMU = {
  PS2: { activity:'xyz.aethersx2.android.EmulationActivity', action:'android.intent.action.MAIN', extraKey:'bootPath' },
  PSP: { activity:'org.ppsspp.ppsspp.PpssppActivity', action:'android.intent.action.VIEW', data:true },
  GAMECUBE: { activity:'org.dolphinemu.dolphinemu.ui.main.MainActivity', action:'android.intent.action.MAIN', extraKey:'AutoStartFile' }
};
const PLAT_EMU = { PS2:'xyz.aethersx2.android', PSP:'org.ppsspp.ppsspp', GAMECUBE:'org.dolphinemu.dolphinemu', SWITCH:'org.yuzu.yuzu_emu', N3DS:'org.citra.citra_emu', GBA:'com.retroarch' };
const EXTS = { PS2:'.iso,.chd,.bin', PSP:'.cso,.iso,.pbp', GAMECUBE:'.rvz,.iso,.gcm', SWITCH:'.nsp,.xci', N3DS:'.3ds,.cia', GBA:'.gba' };
let lastPath = '/storage/emulated/0/ROMS/PS2', lastPlat = 'PS2';

async function launchGame(id){
  const g = games.find(x => String(x.id) === String(id)); if (!g) return;
  if (!Launcher) { toast('Esto solo funciona dentro de la app Android'); return; }
  const e = g.type === 'NATIVE' ? {} : (EMU[g.platform] || {});
  try {
    const r = await Launcher.launch({ package: g.pkg, activity: e.activity, action: e.action, extraKey: e.extraKey, path: g.rom, data: e.data ? g.rom : undefined });
    toast(r.fallback && g.type !== 'NATIVE' ? 'Se abrió el emulador; abre el juego desde ahí' : '▶ Iniciando ' + g.title);
  } catch (err) { toast('⚠️ ' + (err.message || err)); }
}

function openScan(){
  const m = $('modal'); m.classList.remove('hidden'); m.classList.add('flex'); m.style.alignItems = '';
  m.innerHTML = `<div class="bg-gray-900 border border-white/20 rounded-2xl w-full max-w-lg p-6 shadow-2xl">
    <h3 class="text-lg font-bold mb-1">📁 Escanear ROMs</h3>
    <p class="text-xs text-gray-400 mb-3">Escribe la carpeta donde guardas tus juegos y elige el sistema.</p>
    <input id="sp" value="${lastPath}" class="w-full bg-black/60 border border-white/20 rounded-lg p-2 text-xs font-mono mb-2 outline-none">
    <select id="ss" class="w-full bg-black/60 border border-white/20 rounded-lg p-2 text-xs mb-3">${Object.keys(EXTS).map(k => `<option ${k===lastPlat?'selected':''}>${k}</option>`).join('')}</select>
    <p id="sr" class="text-xs text-gray-300 mb-3">Listo para escanear.</p>
    <div class="flex justify-end gap-2"><button onclick="closeModal()" class="px-4 py-2 bg-white/10 rounded-lg text-xs">Cerrar</button><button id="sg" class="px-5 py-2 bg-blue-600 rounded-lg text-xs font-bold">Escanear</button></div></div>`;
  $('sg').onclick = runScan;
}
async function runScan(){
  const out = $('sr');
  if (!Launcher) { out.textContent = 'No se encontró el puente con Android (Capacitor: ' + (window.Capacitor ? 'sí' : 'no') + ').'; return; }
  const path = $('sp').value.trim(), pl = $('ss').value; lastPath = path; lastPlat = pl;
  try {
    const p = await Launcher.hasAllFiles();
    if (!p.granted) { out.textContent = 'Activa “Permitir acceso a todos los archivos” en la pantalla que se abrirá, vuelve a la app y toca Escanear otra vez.'; await Launcher.requestAllFiles(); return; }
    const r = await Launcher.scan({ path, exts: EXTS[pl] });
    let n = 0;
    r.files.forEach(f => {
      if (games.some(g => g.rom === f.path)) return;
      games.unshift({ id: 's' + Date.now() + '_' + (n++), title: f.name.replace(/\.[^.]+$/, '').replace(/_+/g, ' '), type: 'EMULATOR', platform: pl, publisher: '—', year: '—', fav: false, played: false, g: ['#1e3a8a', '#111827'], desc: 'ROM detectada en ' + path, pkg: PLAT_EMU[pl], rom: f.path, emu: PLATFORMS[pl].name });
    });
    save(); idx = 0; render();
    out.textContent = n + ' juegos nuevos agregados (' + r.files.length + ' encontrados).';
  } catch (e) { out.textContent = '⚠️ ' + (e.message || e); }
}

render();
</script>
